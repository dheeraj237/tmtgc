name: Onboard new episodes

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache faster-whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Onboard new episodes
        working-directory: scripts
        run: python3 episodes_manager.py --onboard

      - name: Regenerate data/tmtgc.txt
        run: python3 scripts/build_fortunes.py

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain scripts/episodes.json data/tmtgc.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/episodes.json data/tmtgc.txt
            git commit -m "chore: auto-onboard new episode(s) [skip ci]"
            git push
          else
            echo "No new episodes — nothing to commit."
          fi
